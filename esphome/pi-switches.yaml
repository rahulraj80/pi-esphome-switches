esphome:
  name: pi-switches
  friendly_name: "Pi Control Switches"
  project:
    name: "rahulraj80.pi-esphome-switches"
    version: "1.0.0"

# `host` runs ESPHome natively on this Raspberry Pi (no microcontroller).
# ESPHome is the CONNECTOR only: it exposes buttons/switches to Home Assistant
# via the native API. The actual Pi actions (reboot/shutdown/vnc) are executed
# by the separate pi-control-server (HTTP Basic Auth on port 9090).
host:

# ---------------------------------------------------------------------------
# ESPHome API — port 6053. Home Assistant's ESPHome integration connects here.
# In esphome 2026.x this is the `api` component (not `native_api`).
# ---------------------------------------------------------------------------
api:
  port: 6053

# Logger component (needed for logger.log actions on buttons)
logger:

# ---------------------------------------------------------------------------

# OTA updates via the ESPHome dashboard / Home Assistant (optional)
# ota:
#   - platform: esphome
#     port: 80
#     password: "CHANGE_ME_OTA_PASSWORD"

# ---------------------------------------------------------------------------
# Momentary buttons are created in Home Assistant as input_button helpers
# (not via ESPHome, because ESPHome template buttons on the host platform
# generate duplicate IDs). See automations.yaml for wiring to REST commands.
# ---------------------------------------------------------------------------
# HTTP client — lets the device itself POST to the local pi-control-server
# (HTTP Basic Auth, port 9090) when a button is pressed. ESPHome is the
# connector; the actual actions run on the Pi via the control server.
http_request:
  id: pi_http
  useragent: esphome-pi-switches
  timeout: 5s

# ---------------------------------------------------------------------------
# Momentary actions — one-press buttons (NOT toggles). Pressing one in HA
# asks the device to fire an HTTP POST to the control server.
# Basic Auth header = base64("piadmin:changeme") = cGlhZG1pbjpjaGFuZ2VtZQ==
# ---------------------------------------------------------------------------
button:
  - platform: template
    name: "Reboot Pi"
    icon: mdi:restart
    device_class: restart
    on_press:
      - http_request.post:
          url: "http://127.0.0.1:9090/action/reboot"
          request_headers:
            Authorization: "Basic cGlhZG1pbjpjaGFuZ2VtZQ=="

  - platform: template
    name: "Shutdown Pi"
    icon: mdi:power
    on_press:
      - http_request.post:
          url: "http://127.0.0.1:9090/action/shutdown"
          request_headers:
            Authorization: "Basic cGlhZG1pbjpjaGFuZ2VtZQ=="

  - platform: template
    name: "Update System"
    icon: mdi:package-up
    device_class: update
    on_press:
      - http_request.post:
          url: "http://127.0.0.1:9090/action/update"
          request_headers:
            Authorization: "Basic cGlhZG1pbjpjaGFuZ2VtZQ=="

# ---------------------------------------------------------------------------
# Toggle switch — VNC is a genuine on/off state, so a switch is correct here.
# The device POSTs start/stop to the control server.
# ---------------------------------------------------------------------------
switch:
  - platform: template
    name: "VNC Server"
    icon: mdi:remote-desktop
    optimistic: true
    turn_on_action:
      - http_request.post:
          url: "http://127.0.0.1:9090/action/vnc/start"
          request_headers:
            Authorization: "Basic cGlhZG1pbjpjaGFuZ2VtZQ=="
    turn_off_action:
      - http_request.post:
          url: "http://127.0.0.1:9090/action/vnc/stop"
          request_headers:
            Authorization: "Basic cGlhZG1pbjpjaGFuZ2VtZQ=="

# ---------------------------------------------------------------------------
# Sensors — read-only telemetry (uptime only; command/cpu_temperature
# platforms are not available in all esphome versions)
# ---------------------------------------------------------------------------
sensor:
  - platform: uptime
    name: "Pi Uptime"
    id: uptime_sensor
    update_interval: 60s

#  # Uncomment if your esphome version supports sensor.command
#  - platform: command
#    name: "VNC Service Status"
#    command: "systemctl is-active --quiet vncserver-x11-serviced && echo 1 || echo 0"
#    update_interval: 15s
#    id: vnc_status
#    unit_of_measurement: ""
#    accuracy_decimals: 0
#    internal: true

# ---------------------------------------------------------------------------
# Optional extras — uncomment any you want to enable
# ---------------------------------------------------------------------------

# WiFi toggle (requires NetworkManager / nmcli)
# switch:
#   - platform: template
#     name: "WiFi"
#     icon: mdi:wifi

# Bluetooth toggle
# switch:
#   - platform: template
#     name: "Bluetooth"
#     icon: mdi:bluetooth

# ---------------------------------------------------------------------------
# Status LED (onboard) — optional, shows ESPHome is running
# ---------------------------------------------------------------------------
# status_led:
#   pin:
#     number: GPIO16
#     inverted: true
