esphome:
  name: pi-switches
  friendly_name: "Pi Control Switches"
  project:
    name: "rahulraj80.pi-esphome-switches"
    version: "1.0.0"

# `host` runs ESPHome natively on this Raspberry Pi (no microcontroller).
host:

# ---------------------------------------------------------------------------
# Native API — enabled by default in esphome 2025.x.
# Home Assistant discovers this device via Settings → Devices & Services →
# Add Integration → ESPHome, using this Pi's IP address (or mDNS).
# ---------------------------------------------------------------------------

# OTA updates via the ESPHome dashboard / Home Assistant
ota:
  - platform: esphome
    password: "CHANGE_ME_OTA_PASSWORD"

# ---------------------------------------------------------------------------
# Momentary buttons (press to trigger, auto-reset)
# ---------------------------------------------------------------------------
button:
  - platform: template
    name: "Reboot Pi"
    icon: mdi:restart
    on_press:
      - script.execute: reboot_action

  - platform: template
    name: "Shutdown Pi"
    icon: mdi:power
    on_press:
      - script.execute: shutdown_action

  - platform: template
    name: "Update System"
    icon: mdi:package-up
    on_press:
      - script.execute: update_action

# ---------------------------------------------------------------------------
# Toggle switches (persistent on/off)
# ---------------------------------------------------------------------------
switch:
  - platform: template
    name: "VNC Server"
    icon: mdi:remote-desktop
    turn_on_action:
      - script.execute: vnc_start
    turn_off_action:
      - script.execute: vnc_stop

# ---------------------------------------------------------------------------
# Sensors — read-only telemetry (uptime only; command/cpu_temperature
# platforms are not available in all esphome versions — uncomment below
# if your esphome supports them)
# ---------------------------------------------------------------------------
sensor:
  - platform: uptime
    name: "Pi Uptime"
    id: uptime_sensor
    update_interval: 60s

#  # VNC service status (requires esphome with sensor.command platform)
#  - platform: command
#    name: "VNC Service Status"
#    command: "systemctl is-active --quiet vncserver-x11-serviced && echo 1 || echo 0"
#    update_interval: 15s
#    id: vnc_status
#    unit_of_measurement: ""
#    accuracy_decimals: 0
#    internal: true

#  # CPU temperature (requires esphome with sensor.cpu_temperature platform)
#  - platform: cpu_temperature
#    name: "CPU Temperature"
#    sensor:
#      name: "CPU Temperature Sensor"
#    update_interval: 30s

# ---------------------------------------------------------------------------
# Optional extras — uncomment any you want to enable
# ---------------------------------------------------------------------------

# WiFi toggle (requires NetworkManager / nmcli)
# switch:
#   - platform: template
#     name: "WiFi"
#     icon: mdi:wifi
#     turn_on_action:
#       - shell_command.execute: "sudo nmcli radio wifi on"
#     turn_off_action:
#       - shell_command.execute: "sudo nmcli radio wifi off"

# Bluetooth toggle
# switch:
#   - platform: template
#     name: "Bluetooth"
#     icon: mdi:bluetooth
#     turn_on_action:
#       - shell_command.execute: "sudo rfkill unblock bluetooth"
#     turn_off_action:
#       - shell_command.execute: "sudo rfkill block bluetooth"

# ---------------------------------------------------------------------------
# Scripts — wrap shell commands so buttons/switches can call them
# ---------------------------------------------------------------------------
script:
  - id: reboot_action
    mode: queued
    then:
      - shell_command.execute: "sudo /opt/pi-esphome-switches/scripts/pi-actions.sh reboot"

  - id: shutdown_action
    mode: queued
    then:
      - shell_command.execute: "sudo /opt/pi-esphome-switches/scripts/pi-actions.sh shutdown"

  - id: update_action
    mode: queued
    then:
      - shell_command.execute: "sudo /opt/pi-esphome-switches/scripts/pi-actions.sh update"

  - id: vnc_start
    mode: queued
    then:
      - shell_command.execute: "sudo /opt/pi-esphome-switches/scripts/pi-actions.sh vnc-start"

  - id: vnc_stop
    mode: queued
    then:
      - shell_command.execute: "sudo /opt/pi-esphome-switches/scripts/pi-actions.sh vnc-stop"

# ---------------------------------------------------------------------------
# Status LED (onboard) — optional, shows ESPHome is running
# ---------------------------------------------------------------------------
# status_led:
#   pin:
#     number: GPIO16  # change to your board's LED pin
#     inverted: true
