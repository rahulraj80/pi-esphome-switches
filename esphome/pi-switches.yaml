esphome:
  name: pi-switches
  friendly_name: "Pi Control Switches"
  project:
    name: "rahulraj80.pi-esphome-switches"
    version: "1.0.0"

host:

# ---------------------------------------------------------------------------
# Native API — enabled by default in esphome 2025.x. Home Assistant discovers
# this device via the ESPHome integration (Settings → Devices & Services →
# Add Integration → ESPHome) using this Pi's IP address (or mDNS).
# ---------------------------------------------------------------------------

# OTA updates via the ESPHome dashboard / HA
ota:
  - platform: esphome
    password: "CHANGE_ME_OTA_PASSWORD"

# ---------------------------------------------------------------------------
# Momentary buttons (press to trigger, auto-reset)
# ---------------------------------------------------------------------------
button:
  - platform: template
    name: "Reboot Pi"
    icon: mdi:restart
    on_press:
      - script.execute: reboot_action

  - platform: template
    name: "Shutdown Pi"
    icon: mdi:power
    on_press:
      - script.execute: shutdown_action

  - platform: template
    name: "Update System"
    icon: mdi:package-up
    on_press:
      - script.execute: update_action

# ---------------------------------------------------------------------------
# Toggle switches (persistent on/off)
# ---------------------------------------------------------------------------
switch:
  - platform: template
    name: "VNC Server"
    icon: mdi:remote-desktop
    id: vnc_switch
    turn_on_action:
      - script.execute: vnc_start
    turn_off_action:
      - script.execute: vnc_stop
    lambda: |-
      // Reflect the real service state (polled by the status sensor below)
      return id(vnc_status).state > 0.5;

# ---------------------------------------------------------------------------
# Sensors — read-only status telemetry
# ---------------------------------------------------------------------------
sensor:
  # VNC service status (1 = running, 0 = stopped) — feeds the toggle above
  - platform: command
    name: "VNC Service Status"
    command: "systemctl is-active --quiet vncserver-x11-serviced && echo 1 || echo 0"
    update_interval: 15s
    id: vnc_status
    unit_of_measurement: ""
    accuracy_decimals: 0
    internal: true

  # CPU temperature
  - platform: cpu_temperature
    name: "CPU Temperature"
    sensor:
      name: "CPU Temperature Sensor"
    update_interval: 30s

  # Uptime
  - platform: uptime
    name: "Pi Uptime"
    id: uptime_sensor
    update_interval: 60s

  # Optional: CPU load average (uncomment to use)
  # - platform: cpu_load
  #   name: "CPU Load"
  #   update_interval: 30s

# ---------------------------------------------------------------------------
# Optional extras — uncomment any you want to enable
# ---------------------------------------------------------------------------

