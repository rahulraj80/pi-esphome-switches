esphome:
  name: pi-switches
  friendly_name: "Pi Control Switches"
  project:
    name: "rahulraj80.pi-esphome-switches"
    version: "1.0.0"

# `host` runs ESPHome natively on this Raspberry Pi (no microcontroller).
# ESPHome is the CONNECTOR only: it exposes buttons/switches to Home Assistant
# via the native API. The actual Pi actions (reboot/shutdown/vnc) are executed
# by the separate pi-control-server (HTTP Basic Auth on port 9090).
host:

# ---------------------------------------------------------------------------
# ESPHome API — port 6053. Home Assistant's ESPHome integration connects here.
# In esphome 2026.x this is the `api` component (not `native_api`).
# ---------------------------------------------------------------------------
api:
  port: 6053

# Logger component (needed for logger.log actions on buttons)
logger:

# ---------------------------------------------------------------------------

# OTA updates via the ESPHome dashboard / Home Assistant (optional)
# ota:
#   - platform: esphome
#     port: 80
#     password: "CHANGE_ME_OTA_PASSWORD"

# ---------------------------------------------------------------------------
# Momentary buttons are created in Home Assistant as input_button helpers
# (not via ESPHome, because ESPHome template buttons on the host platform
# generate duplicate IDs). See automations.yaml for wiring to REST commands.
# ---------------------------------------------------------------------------

# Controls — all exposed as ESPHome switches so they appear on the device
# page in Home Assistant under "Controls". ESPHome (host platform) cannot run
# shell commands itself, so each switch is driven by an HA automation that
# calls the pi-control-server (HTTP Basic Auth on :9090).
#
# Reboot / Shutdown / Update are momentary: the automation turns the switch
# back off after firing the action. VNC is a genuine on/off toggle.
# ---------------------------------------------------------------------------
switch:
  - platform: template
    name: "Reboot Pi"
    icon: mdi:restart
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Shutdown Pi"
    icon: mdi:power
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Update System"
    icon: mdi:package-up
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "VNC Server"
    icon: mdi:remote-desktop
    optimistic: true

# ---------------------------------------------------------------------------
# Sensors — read-only telemetry (uptime only; command/cpu_temperature
# platforms are not available in all esphome versions)
# ---------------------------------------------------------------------------
sensor:
  - platform: uptime
    name: "Pi Uptime"
    id: uptime_sensor
    update_interval: 60s

#  # Uncomment if your esphome version supports sensor.command
#  - platform: command
#    name: "VNC Service Status"
#    command: "systemctl is-active --quiet vncserver-x11-serviced && echo 1 || echo 0"
#    update_interval: 15s
#    id: vnc_status
#    unit_of_measurement: ""
#    accuracy_decimals: 0
#    internal: true

# ---------------------------------------------------------------------------
# Optional extras — uncomment any you want to enable
# ---------------------------------------------------------------------------

# WiFi toggle (requires NetworkManager / nmcli)
# switch:
#   - platform: template
#     name: "WiFi"
#     icon: mdi:wifi

# Bluetooth toggle
# switch:
#   - platform: template
#     name: "Bluetooth"
#     icon: mdi:bluetooth

# ---------------------------------------------------------------------------
# Status LED (onboard) — optional, shows ESPHome is running
# ---------------------------------------------------------------------------
# status_led:
#   pin:
#     number: GPIO16
#     inverted: true
